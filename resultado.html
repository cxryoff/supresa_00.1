<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado - Surpresa!</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="result-container">
        <div class="result-content">
            <h1>🎉 Resultado Final! 🎉</h1>
            
            <div class="result-text">
                <p>Vamos ser sinceros... o maior tempo que você já me esperou foi <strong>30 minutos</strong>!</p>
                <p class="surprise"><strong>🎬 Surpresa!</strong> Que tal sairmos para o cinema?</p>
            </div>
            
            <div class="result-image">
                <img src="./image.jpg" alt="Imagem especial" onerror="this.style.display='none'">
            </div>
            
            <div class="result-actions">
                <button class="action-button" onclick="window.location.href='quiz.html'">
                    🔄 Fazer Quiz Novamente
                </button>
                <button class="action-button primary" onclick="alert('Te amo! ❤️')">
                    ❤️ Aceitar Convite
                </button>
            </div>
        </div>
    </div>
</body>
</html>
